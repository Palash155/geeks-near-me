<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Geeks Near Me form definitions</title></head>
  <body>
    <form name="appointment-request" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="appointment-request">
      <input type="text" name="service">
      <input type="text" name="name">
      <input type="tel" name="phone">
      <input type="text" name="address">
      <input type="text" name="preferredTime">
      <textarea name="issue"></textarea>
      <input type="text" name="website">
    </form>
  </body>
</html>
